<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OM Studio V3.2 Object Tools</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0b0a}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c0b0a}</style></head><body><iframe id="studioCore" title="OM Studio 3D Core" src="./om-studio-v3-stand-a.html" allow="fullscreen"></iframe><script>(()=>{const f=document.getElementById('studioCore');f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow,p=d.getElementById('panel');if(!p)return;let btn=d.getElementById('useObjectTool');if(!btn){btn=d.createElement('button');btn.id='useObjectTool';btn.type='button';btn.textContent='USE TOOL';btn.style.cssText='width:100%;margin-top:18px;padding:12px 14px;border:1px solid rgba(216,181,122,.45);border-radius:12px;background:#e9ddcc;color:#17130f;font:800 10px/1 system-ui;letter-spacing:.18em;cursor:pointer;';p.appendChild(btn)}btn.addEventListener('click',()=>{const kind=(d.getElementById('pk')?.textContent||'tool').trim().toLowerCase();const title=(d.getElementById('pt')?.textContent||'3D Object').trim();const room=(d.getElementById('pr')?.textContent||'OM Studio').trim();window.parent.postMessage({type:'om-object-tool',kind,title,room},'https://www-legal.net')});const note=d.createElement('div');note.textContent='Each interactive object is linked to a private OM Studio tool.';note.style.cssText='margin-top:10px;color:#9c9488;font:10px/1.5 system-ui;';p.appendChild(note)}catch(e){console.error('OM object tool bridge unavailable',e)}})})();</script></body></html>
