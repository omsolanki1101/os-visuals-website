<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OM Studio V3.2 Object Tools</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0b0a}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c0b0a}</style></head><body><iframe id="studioCore" title="OM Studio 3D Core" src="./om-studio-v3-stand-a.html" allow="fullscreen"></iframe><script>(()=>{const f=document.getElementById('studioCore');f.addEventListener('load',()=>{try{const d=f.contentDocument,p=d.getElementById('panel');if(!p)return;const desc=d.getElementById('pd'),body=d.getElementById('pb'),grid=p.querySelector('.grid');let detailHead=d.getElementById('objectDetailHead');if(!detailHead){detailHead=d.createElement('div');detailHead.id='objectDetailHead';detailHead.innerHTML='<div style="margin-top:14px;color:#d8b57a;font:700 9px/1 system-ui;letter-spacing:.18em">OBJECT DETAILS</div>';if(desc)desc.parentNode.insertBefore(detailHead,desc)}let action=d.getElementById('objectToolAction');if(!action){action=d.createElement('div');action.id='objectToolAction';action.style.cssText='margin-top:18px;padding:14px;border:1px solid rgba(216,181,122,.28);border-radius:14px;background:rgba(216,181,122,.055);';action.innerHTML='<div style="color:#d8b57a;font:700 9px/1 system-ui;letter-spacing:.18em">TOOL OPTION</div><div id="objectToolName" style="margin-top:7px;color:#f4f0e8;font:700 13px/1.25 system-ui">Private OM Studio Tool</div><div id="objectToolHint" style="margin-top:6px;color:#a9a094;font:10px/1.5 system-ui">Open the tool connected to this object while keeping the object details visible above.</div>';const btn=d.createElement('button');btn.id='useObjectTool';btn.type='button';btn.textContent='OPEN THIS TOOL';btn.style.cssText='width:100%;margin-top:12px;padding:13px 14px;border:1px solid rgba(216,181,122,.45);border-radius:12px;background:#e9ddcc;color:#17130f;font:800 10px/1 system-ui;letter-spacing:.18em;cursor:pointer;';action.appendChild(btn);p.appendChild(action);btn.addEventListener('click',()=>{const kind=(d.getElementById('pk')?.textContent||'tool').trim().toLowerCase();const title=(d.getElementById('pt')?.textContent||'3D Object').trim();const room=(d.getElementById('pr')?.textContent||'OM Studio').trim();window.parent.postMessage({type:'om-object-tool',kind,title,room},'https://www-legal.net')})}const toolNames={daily:'Daily Focus Tool',study:'University Tool',career:'Career & Job Tool',identity:'1120 Systems Tool',project:'Project Tool',deploy:'Deployment Tool',debug:'Debug & QA Tool',learn:'Learning Tool',recon:'Authorized Recon Tool',kali:'Kali Defense Tool',websec:'Web Security Tool',business:'Business Research Tool',revenue:'Revenue Tool',intel:'Intelligence Tool',analytics:'Analytics Tool',astra:'Astra Security Tool'};const update=()=>{const kind=(d.getElementById('pk')?.textContent||'tool').trim().toLowerCase(),title=(d.getElementById('pt')?.textContent||'3D Object').trim(),name=d.getElementById('objectToolName'),hint=d.getElementById('objectToolHint');if(name)name.textContent=toolNames[kind]||`${title} Tool`;if(hint)hint.textContent=`Use the ${toolNames[kind]||'matching private tool'} for this object. The description, room and operating details stay visible above.`};const obs=new MutationObserver(update);['pk','pt','pd','pr','pb'].forEach(id=>{const el=d.getElementById(id);if(el)obs.observe(el,{childList:true,characterData:true,subtree:true})});update()}catch(e){console.error('OM object tool bridge unavailable',e)}})})();</script></body></html>
